# Generates PronarkHealth.xcodeproj. Run `xcodegen` in this folder (see ../README.md).
name: PronarkHealth
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  PronarkHealth:
    type: application
    platform: iOS
    sources: [PronarkHealth]
    dependencies:
      - package: Supabase
      - sdk: HealthKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRONARK_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(PRONARK_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
    info:
      path: PronarkHealth/Info.plist
      properties:
        CFBundleDisplayName: Pronark Health
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Read-only. No write (NSHealthUpdateUsageDescription) and no location keys on purpose.
        NSHealthShareUsageDescription: Pronark reads your daily step count and workout minutes to suggest check-ins for the activities you link. Nothing is checked off until you confirm it.
        CFBundleURLTypes:
          - CFBundleURLName: Pronark sign-in
            CFBundleURLSchemes: [pronark]
        PronarkSupabaseHost: $(PRONARK_SUPABASE_HOST)
        PronarkSupabaseAnonKey: $(PRONARK_SUPABASE_ANON_KEY)
    entitlements:
      path: PronarkHealth/PronarkHealth.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
